<app-header></app-header>
<div class="espaciado"></div>

<div class="row">
  <div class="col-md-4"></div>
  <div class="col-md-4">
    <div id="carouselExampleControlsNoTouching" class="carousel slide" data-bs-touch="false" data-bs-interval="false">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="assets/img/slider-templates/alpha.jpeg" height="200" width="auto" class="d-block mx-auto cursor-p" alt="..." (click)="cargarAlpha()">
        </div>
        <div class="carousel-item">
          <img src="assets/img/slider-templates/beta.jpg" height="200" width="auto" class="d-block mx-auto cursor-p"  alt="..." (click)="cargarBeta()">
        </div>
        <div class="carousel-item">
          <img src="assets/img/slider-templates/example.png" height="200" width="auto" class="d-block mx-auto"  alt="...">
        </div>
      </div>
      <button class="carousel-control-prev bg-cero border-0" type="button" data-bs-target="#carouselExampleControlsNoTouching" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next bg-cero border-0" type="button" data-bs-target="#carouselExampleControlsNoTouching" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>
  <div class="col-md-4"></div>
</div>

@if (alpha) {
  <app-alpha [contenido]="datosGenerales"></app-alpha>
}

@if (beta) {
  <app-beta [contenido]="datosGenerales"></app-beta>
}

<div class="espaciado"></div>

<app-footer></app-footer>

<div class="modal" id="modalLoader" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-transparent">
      <div class="text-center">
        <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </div>
  </div>
</div>
