<app-header></app-header>
<main class="container-fluid">
<div class="espacio-superior"></div>
<h1 class="visually-hidden">Galería de plantillas</h1>

@if (sinPerfil) {
  <div class="galeria-vacia text-center f-open-sans-c">
    <h2 class="f-shadow-into-l text-light fs-30">Aún no tienes un perfil guardado</h2>
    <p class="text-light">Llena tus datos una vez y aquí los verás en cada plantilla.</p>
    <a class="galeria-accion" href="profile">Ir a mi perfil</a>
  </div>
}

@if (!sinPerfil) {
<div class="row">
  <div class="col-md-4"></div>
  <div class="col-md-4">
    <div id="carouselExampleControlsNoTouching" class="carousel slide" data-bs-touch="false" data-bs-interval="false">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <button type="button" class="btn-miniatura d-block mx-auto" [attr.aria-pressed]="iota" (click)="cargarIota()">
            <img src="assets/img/slider-templates/iota.png" height="200" width="155" class="d-block" alt="Ver plantilla Iota, lista para sistemas ATS">
          </button>
        </div>
        <div class="carousel-item">
          <img src="assets/img/slider-templates/example.png" height="200" width="auto" class="d-block mx-auto" alt="Ejemplo de plantilla">
        </div>
      </div>
      <button class="carousel-control-prev bg-cero border-0" type="button" data-bs-target="#carouselExampleControlsNoTouching" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next bg-cero border-0" type="button" data-bs-target="#carouselExampleControlsNoTouching" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>
  </div>
  <div class="col-md-4"></div>
</div>

<!-- Si una plantilla es mas ancha que la pantalla, se desplaza aqui sin ensanchar la pagina -->
<div class="plantilla-contenedor" tabindex="0" role="region" aria-label="Vista previa de la plantilla">
  @if (iota) {
    <app-iota [contenido]="datosGenerales"></app-iota>
  }
</div>
}
</main>

<div class="espaciado"></div>

<app-footer></app-footer>

<div class="modal" id="modalLoader" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-transparent">
      <div class="text-center">
        <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status">
          <span class="visually-hidden">Cargando…</span>
        </div>
      </div>
    </div>
  </div>
</div>
