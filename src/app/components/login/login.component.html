<div>
  <app-header></app-header>
  <div class="espaciado"></div>
  <div class="row">
    <div class="col-md-1"></div>
    <div class="col-md-10">
      <div class="row">
        <div class="col-md-8">

        </div>
        <div class="col-md-4">
          <div class="p-5 text-center sombraUno">
            <div class="p-5">
              <img src="assets/img/icons/WORKFACE - blue.png" alt="" class="img-fluid drop">
            </div>
            <form [formGroup]="form" autocomplete="off">
              @if (ingreso) {
                <h3 class="text-light f-shadow-into-l fs-30">INGRESAR</h3>
              }
              @if (registro) {
                <h3 class="text-light f-shadow-into-l fs-30">REGISTRAR</h3>
              }
              @if (recordar) {
                <h3 class="text-light f-shadow-into-l fs-30">RECORDAR CLAVE</h3>
              }
              <input class="f-open-sans-c text-light fw-3 w-100 mb-2 ps-2 bg-transparent" autocomplete="off" id="email" type="text" placeholder="Email" formControlName="email">
              @if (ingreso || registro) {
                <div class="position-relative mb-2">
                  <input class="f-open-sans-c fw-3 w-100 ps-2 pe-5 text-light bg-transparent" autocomplete="off" [type]="mostrarClave ? 'text' : 'password'" placeholder="Clave" formControlName="password">
                  <button type="button" class="btn-ver-clave position-absolute top-50 end-0 translate-middle-y bg-transparent border-0 text-light" [attr.aria-label]="mostrarClave ? 'Ocultar clave' : 'Mostrar clave'" [attr.aria-pressed]="mostrarClave" (click)="mostrarClave = !mostrarClave">
                    <i class="max" [class.max-eye]="!mostrarClave" [class.max-eye-blocked]="mostrarClave" aria-hidden="true"></i>
                  </button>
                </div>
              }
              @if (registro) {
                <div class="position-relative mb-3">
                  <input class="f-open-sans-c fw-3 w-100 ps-2 pe-5 text-light bg-transparent" [type]="mostrarConfirmacion ? 'text' : 'password'" placeholder="Confirmar clave" formControlName="confirmPassword">
                  <button type="button" class="btn-ver-clave position-absolute top-50 end-0 translate-middle-y bg-transparent border-0 text-light" [attr.aria-label]="mostrarConfirmacion ? 'Ocultar clave' : 'Mostrar clave'" [attr.aria-pressed]="mostrarConfirmacion" (click)="mostrarConfirmacion = !mostrarConfirmacion">
                    <i class="max" [class.max-eye]="!mostrarConfirmacion" [class.max-eye-blocked]="mostrarConfirmacion" aria-hidden="true"></i>
                  </button>
                </div>
              }
              <button class="tc-yellow-one bg-transparent border-0 mb-4 f-open-sans-c fw-3" (click)="submit()">ENVIAR</button><br>


              @if (!ingreso) {
                <a class="text-light f-open-sans-c fw-3 cursor-p" (click)="ajustesIngresar()">INGRESAR </a>
              }
              @if (separar) {
                <span class="text-light f-open-sans-c">/</span>
              }
              @if (!registro) {
                <a class="tc-blue-one f-open-sans-c fw-3 cursor-p" (click)="ajustesRegistrar()"> REGISTRAR</a>
                }<br>
                @if (!recordar) {
                  <a class="fuenteUno t3 fw-3 cursor-p" (click)="ajustesRecordarClave()">RECORDAR CONTRASEÑA</a>
                }
                @if (camposRegistrar) {
                  <button class="w-100">REGISTRAR</button>
                }

              </form>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-1"></div>
    </div>
    <div class="espaciado"></div>
    <div class="espaciado"></div>
  </div>
